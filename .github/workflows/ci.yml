# Strop CI.
#
# Gating jobs — required for a merge, via the `ci-success` aggregator below:
#   core    — strop-core: clippy -D warnings + the property suite at an elevated
#             PROPTEST_CASES. Fast, dependency-light, the reliable gate.
#   app     — strop-app on Linux: builds the git-pinned gpui (wgpu + Wayland),
#             clippy, and the headless logic tests.
#   deny    — cargo-deny (licenses, advisories, git sources) plus a freshness
#             check on the attribution document the About window embeds.
#   packaging — appstream/desktop-file/flatpak-manifest validation (no compile).
#   macos   — build + a launch smoke.
#   windows — build + tests (single_instance over named pipes) + launch smoke.
#
# macos/windows were informational (continue-on-error) while those targets were
# brought up; promoted into the required set on 2026-06-17 once green. The reds
# along the way were real, fixed bugs — compile failures, then the Windows
# named-pipe `single_instance` test — never runner flake. If the launch-smoke
# ever hangs on GPU/WindowServer/Metal/D3D init (the 60s watchdog exits 1),
# demote the offending job: re-add `continue-on-error: true` and drop it from
# `ci-success.needs`.
#
# The toolchain version is pinned in rust-toolchain.toml; rustup honours it in
# the repo dir, so the cache key stays stable across upstream stable releases.
#
# Deliberately NO `cargo fmt --check`: this repo is hand-formatted, not
# rustfmt-canonical, so a format gate would fail on untouched code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels superseded, still-running jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default. No job here writes to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds each crate once per job and never reuse incremental artifacts
  # across runs (rust-cache restores the dep rlibs, not the incremental DB), so
  # incremental only adds write overhead and bloats the cache. Off is faster.
  CARGO_INCREMENTAL: 0
  # CI compiles and runs tests; it doesn't debug the binary. Skip debuginfo for
  # the dev profile — a real win on Windows, where full PDB generation over the
  # gpui tree is slow. Trade-off: panic backtraces lose symbols/line info; if a
  # green pipeline ever needs them, bump this to "line-tables-only".
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  core:
    name: core engine — clippy + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: core
      - name: clippy (warnings denied)
        run: cargo clippy -p strop-core --all-targets -- -D warnings
      - name: tests (elevated proptest cases)
        env:
          # The harness (tests/model.rs, tests/robustness.rs) reads this; the
          # bug-hunt pass validated green at 4096 in ~1.5s, so 2048 per push is
          # cheap insurance against boundary regressions the default 256 misses.
          PROPTEST_CASES: "2048"
        run: cargo test -p strop-core

  deny:
    name: supply chain — cargo-deny + embedded attribution
    runs-on: ubuntu-latest
    # cargo-deny only runs `cargo metadata` — it compiles nothing. The old
    # EmbarkStudios Docker action was slow for a non-obvious reason: its musl
    # container has no toolchain, so rust-toolchain.toml forced a full 1.96.0
    # install (~13s) AND, with a cold cargo home, `cargo metadata` re-cloned the
    # giant Zed git deps every run (~1m40s of silent work). Running on the host
    # with a cached cargo home fixes both: any cargo resolves the graph (workspace
    # is edition 2024, so the runner's preinstalled stable is fine — no 1.96.0
    # download), and the Zed clone + advisory db are reused across runs.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: cache cargo home (git deps + registry + advisory db)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/advisory-dbs
          key: cargo-deny-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: cargo-deny-
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          # cargo-about is pinned to an exact version on purpose. Its output is
          # compared byte-for-byte against a committed file, so an upstream
          # formatting change would otherwise red every open PR at once instead
          # of the one that caused it. Bump it and regenerate in the same commit.
          tool: cargo-deny,cargo-about@0.9.1
      - run: cargo deny check
      # The About window embeds assets/third-party-licenses.txt through
      # include_str!, so a stale file is not untidiness — it is a shipped
      # falsehood, crediting crates the binary no longer contains and misstating
      # the versions of the ones it does. docs/releasing.md §8 promised this
      # check from the start and nobody wrote it; the file was found in 2026-07
      # still naming strop-app 0.2.0. --locked so CI compares against the
      # committed lockfile rather than one it resolved for itself.
      - name: the embedded attribution still matches Cargo.lock
        run: |
          cargo about generate --locked about.hbs -o "$RUNNER_TEMP/regenerated.txt"
          if diff -u assets/third-party-licenses.txt "$RUNNER_TEMP/regenerated.txt" > "$RUNNER_TEMP/drift.diff"; then
            echo "attribution matches the lockfile"
          else
            echo "::error::assets/third-party-licenses.txt has drifted from Cargo.lock. Regenerate with: cargo about generate about.hbs -o assets/third-party-licenses.txt"
            head -200 "$RUNNER_TEMP/drift.diff"
            exit 1
          fi

  packaging:
    # Compiles nothing; exists so desktop-integration metadata can't drift
    # unnoticed between releases. The release preflight separately refuses a
    # tag whose version is missing from the metainfo <releases> — this job
    # keeps the files structurally valid on every push so that refusal is
    # the only surprise left.
    name: packaging — appstream, desktop file, flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils python3-yaml
      - run: appstreamcli validate packaging/linux/cc.pimenov.strop.metainfo.xml
      - run: desktop-file-validate packaging/linux/cc.pimenov.strop.desktop
      - name: flatpak manifest sanity (parses; asset name matches release.yml's)
        run: |
          python3 - <<'EOF'
          import re, yaml
          m = yaml.safe_load(open('packaging/flatpak/cc.pimenov.strop.yml'))
          assert m['app-id'] == 'cc.pimenov.strop', m['app-id']
          src = m['modules'][0]['sources'][0]
          assert isinstance(src['sha256'], str) and re.fullmatch(r'[0-9a-f]{64}', src['sha256']), 'sha256 must be a 64-hex string'
          suffix = '-x86_64-unknown-linux-gnu-flathub.tar.gz'
          assert src['url'].endswith(suffix), src['url']
          assert suffix in src['x-checker-data']['url-query'], 'x-checker-data must track the flathub tarball'
          EOF

  app:
    name: app shell — clippy + headless logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: gpui system dependencies (Zed Linux build reqs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libvulkan-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libxcb1-dev \
            libx11-dev \
            libxext-dev
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: app
      - name: clippy (warnings denied)
        run: cargo clippy -p strop-app --all-targets -- -D warnings
      - name: tests (headless — pure-logic helpers open no window)
        run: cargo test -p strop-app

  macos:
    # Required (promoted 2026-06-17). gpui selects its Metal backend (gpui_macos)
    # here. If the launch-smoke flakes on Metal/WindowServer init, re-add
    # `continue-on-error: true` and drop this from `ci-success.needs`.
    name: macOS — build + launch smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: macos
      - name: build (debug)
        run: cargo build -p strop-app
      - name: launch smoke — open a window, run a scripted session, exit 0
        run: |
          set +e
          # Tier-1 liveness: with no file and no STROP_SMOKE_HOLD the app opens
          # a window over the built-in sample, replays a few caret motions, and
          # quits on its own (smoke.rs). We watchdog it by hand — macOS has no
          # `timeout(1)` — so a hung WindowServer/Metal init can't wedge the job.
          STROP_SMOKE="down down up right left" ./target/debug/strop &
          PID=$!
          for _ in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "::warning::smoke still alive after 60s — killing (window/Metal init likely hung on the runner)"
            kill "$PID" 2>/dev/null
            exit 1
          fi
          wait "$PID"
          code=$?
          echo "smoke exit code: $code"
          exit $code

  windows:
    # Required (promoted 2026-06-17). Unlike macOS this also runs `cargo test` —
    # the single_instance suite exercises the *named-pipe* IPC path here, so a
    # green run is real cross-platform verification of the rendezvous logic, not
    # just a compile. If the launch-smoke flakes on D3D init, re-add
    # `continue-on-error: true` and drop this from `ci-success.needs`.
    name: Windows — build + tests + launch smoke
    runs-on: windows-latest
    steps:
      - name: exclude build dirs from Defender (Windows build speedup)
        # Defender real-time scanning of every .rlib/.rmeta/.pdb the compiler
        # emits is a major drag on Windows runners. Exclude the workspace and the
        # cargo/rustup homes so the cache restore, toolchain, and gpui build all
        # run unscanned. First step so it covers everything. Non-fatal: if a
        # runner blocks Add-MpPreference, we just build without the speedup.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($p in @($env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")) {
            try   { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "excluded $p" }
            catch { Write-Host "::warning::could not exclude $p from Defender: $_" }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows
      - name: build (debug)
        run: cargo build -p strop-app
      - name: tests (headless — incl. single_instance over named pipes)
        run: cargo test -p strop-app
      - name: launch smoke — open a window, run a scripted session, exit 0
        shell: bash
        run: |
          set +e
          # Same Tier-1 liveness as macOS, via Git Bash so the watchdog is
          # portable. wgpu picks DX12 (or the WARP software fallback) here.
          STROP_SMOKE="down down up right left" ./target/debug/strop.exe &
          PID=$!
          for _ in $(seq 1 60); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "::warning::smoke still alive after 60s — killing (window/D3D init likely hung on the runner)"
            kill "$PID" 2>/dev/null
            exit 1
          fi
          wait "$PID"
          code=$?
          echo "smoke exit code: $code"
          exit $code

  ci-success:
    # The single required status check for branch protection. `if: always()` +
    # explicit result checks avoid the classic trap where a skipped dependency
    # leaves a "required" check pending forever. macOS/Windows joined the gate on
    # 2026-06-17 (see header); demote a leg by dropping it from `needs` and the
    # loop below.
    name: CI passed
    needs: [core, app, deny, packaging, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: require core, app, deny, packaging, macOS, and Windows to have succeeded
        run: |
          ok=true
          for r in "core=${{ needs.core.result }}" \
                   "app=${{ needs.app.result }}" \
                   "deny=${{ needs.deny.result }}" \
                   "packaging=${{ needs.packaging.result }}" \
                   "macos=${{ needs.macos.result }}" \
                   "windows=${{ needs.windows.result }}"; do
            echo "$r"
            case "$r" in *=success) ;; *) ok=false ;; esac
          done
          $ok
